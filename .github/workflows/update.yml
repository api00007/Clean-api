name: Update Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Script
        env:
          API_URL: ${{ secrets.API_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TGITHUB_USER: ${{ secrets.TGITHUB_USER }}
          TGITHUB_REPO: ${{ secrets.TGITHUB_REPO }}
          TGITHUB_EMAIL: ${{ secrets.TGITHUB_EMAIL }}
        run: |
          python main.py
